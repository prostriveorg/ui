name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Type-check
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Format
        run: yarn format:check
      - name: Unit and render tests (against dist)
        run: yarn test
      - name: Verify packed artifact in an isolated consumer
        run: yarn verify:pack
      - name: Browser checks (generated-data playground, Chrome)
        run: |
          yarn playground:build
          yarn browser:check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-screenshots
          path: .browser-check/
          retention-days: 7
          if-no-files-found: ignore

name: Release

# Publishes an explicitly versioned release to GitHub Packages when a `v<version>` tag is
# pushed. The tag must equal package.json `version`. The tarball verified in the first job is
# the one published by the second; only the publish job can write packages.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - name: Verify packed artifact in an isolated consumer
        run: yarn verify:pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: .pack-check/prostriveorg-ui-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: packages
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@prostriveorg'
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "prostriveorg-ui-${VERSION}.tgz" \
            --registry https://npm.pkg.github.com --tag "$tag" --ignore-scripts
